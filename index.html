<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F6EFDD" />
    <meta name="description" content="小雨点菜手账 —— 记菜谱、随机点菜、分享今日菜单，纯离线可用" />

    <!-- 不加 maximum-scale / user-scalable=no：那会禁用缩放，且并不能阻止
         iOS 聚焦放大（真正管用的是输入框 font-size >= 16px）。 -->

    <!-- iOS 添加到主屏幕：全屏无地址栏 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="小雨点菜" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light" />

    <title>小雨点菜手账</title>

    <!--
      PWA 清单 & 图标。

      这里写的是同目录的相对路径，但 **构建时会被 vite.config.ts 里的
      inlinePwaAssets() 换成 data: URI** —— 「只拿走 index.html 一个文件」
      双击打开时（file://）取不到旁边的 manifest 和 png，只有内联才有效。
      内联内容由 public/manifest.webmanifest 派生，换图标不用动这个文件。

      托管（http/https）时，下面那段启动脚本又会把它们换回同目录的真实
      文件，这样 Service Worker 和图标缓存都走正常路径。
    -->
    <link id="app-manifest" rel="manifest" href="./manifest.webmanifest" />
    <link id="app-icon" rel="apple-touch-icon" href="./icon-180.png" />

    <style>
      /* 首屏兜底：JS 加载/解析之前的底色，避免白屏闪一下 */
      html,
      body {
        margin: 0;
        background: #f6efdd;
        color: #4a423c;
        font-family: "Kaiti SC", "STKaiti", "楷体", "KaiTi", "LXGW WenKai",
          serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei",
          sans-serif;
      }
      #boot {
        padding: 40vh 24px 0;
        text-align: center;
        font-size: 16px;
        color: #a89b85;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">正在翻开手账…</div></div>
    <noscript>
      <p style="padding: 24px; text-align: center">
        这个手账需要开启 JavaScript 才能使用。
      </p>
    </noscript>

    <script>
      // 单文件兜底 vs 静态托管增强。
      // file:// 双击打开时：manifest 用内联 data URI，不注册 Service Worker
      // （file:// 下 SW 与相对路径资源都不可用）。
      // http(s) 部署时：换成同目录的真实文件，并注册 Service Worker 以支持断网。
      (function () {
        var hosted = location.protocol === 'http:' || location.protocol === 'https:'
        if (!hosted) return
        var icon = document.getElementById('app-icon')
        if (icon) icon.setAttribute('href', './icon-180.png')
        var mf = document.getElementById('app-manifest')
        if (mf) mf.setAttribute('href', './manifest.webmanifest')
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('./sw.js').catch(function () {
              /* 没有 sw.js 也不影响使用，只是少了离线缓存 */
            })
          })
        }
      })()
    </script>

    <script>
      // 启动诊断。必须排在应用脚本之前，才能捕获到它的错误。
      //
      // 起因：在微信 iOS 里点开本地 html，一直停在「正在翻开手账…」。
      // 真实原因是文档处于不透明源、WebKit 拒绝执行内联 module 脚本，
      // 但界面上完全看不出发生了什么 —— 一个永远转圈的开屏比报错难查得多。
      // 所以这里做两件事：捕获错误并显示出来，外加一个「脚本压根没跑」的看门狗。
      (function () {
        var errors = []

        function render() {
          // 应用挂载成功后会在 main.tsx 里置上这个标记。
          // 用它而不是「#boot 还在不在」判断，是因为 React 挂载时会清空
          // #root —— 若崩在挂载之后，#boot 已经没了，靠它判断就会漏报。
          if (window.__handbookMounted) return

          var host = document.getElementById('boot')
          if (!host) {
            // #boot 已经被 React 清掉了，说明挂载进行到一半才崩的。
            // 这时自己造一个容器，别去覆盖 body（那会把已有内容一起抹了）。
            host = document.createElement('div')
            host.id = 'boot-failed'
            document.body.appendChild(host)
          }

          var ua = navigator.userAgent
          var env = [
            '地址协议：' + location.protocol,
            '运行环境：' + (/MicroMessenger/i.test(ua) ? '微信内置浏览器' : '其它浏览器'),
            'IndexedDB：' + ('indexedDB' in window ? '有' : '没有'),
          ].join('<br>')

          host.setAttribute('style', 'padding:32px 20px;text-align:left;letter-spacing:0;line-height:1.7')
          host.innerHTML =
            '<div style="font-size:19px;font-weight:700;color:#c0503f;margin-bottom:10px">手账没能翻开</div>' +
            '<div style="font-size:15px;color:#6b6153;margin-bottom:14px">' +
            (errors.length
              ? '错误信息（截图发给开发者就行）：'
              : '应用脚本似乎完全没有执行，可能被浏览器拦住了。') +
            '</div>' +
            (errors.length
              ? '<pre style="font-size:12px;white-space:pre-wrap;word-break:break-all;background:rgba(0,0,0,0.05);padding:10px;border-radius:8px;margin:0 0 14px">' +
                errors.slice(0, 3).join('\n\n').replace(/[<>&]/g, function (c) {
                  return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]
                }) +
                '</pre>'
              : '') +
            '<div style="font-size:13px;color:#a89b85">' + env + '</div>'
        }

        window.addEventListener('error', function (e) {
          errors.push((e.message || '脚本加载失败') + (e.filename ? '\n@ ' + e.filename + ':' + e.lineno : ''))
          render()
        })

        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          errors.push('未处理的 Promise 异常：' + ((r && r.message) || String(r)))
          render()
        })

        // 看门狗：8 秒还没挂载上就报。这一步专门抓「脚本根本没执行」
        // —— 那种情况不会触发任何 error 事件，只有干等才看得出来。
        setTimeout(render, 8000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
